<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">OfferMe macOS audio routing</title><desc id="desc">The meeting outputs to a multi-output device. One branch goes to headphones; another goes through BlackHole to OfferMe and the speech API. Transcribed text and selected documents can be sent to a separate answer API.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#317761"/></marker></defs>
<rect width="1200" height="620" rx="26" fill="#eff6f1"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#123e37">
<text x="48" y="58" font-size="29" font-weight="700">Hear the meeting. Capture the same audio.</text><text x="48" y="89" font-size="17" fill="#52695e">macOS · BlackHole 2ch + your physical output · two independently configured cloud services</text>
<g fill="#fff" stroke="#b4c9bb" stroke-width="2"><rect x="48" y="190" width="218" height="106" rx="16"/><rect x="321" y="190" width="247" height="106" rx="16"/><rect x="630" y="140" width="225" height="88" rx="16"/><rect x="630" y="270" width="225" height="88" rx="16"/><rect x="910" y="270" width="242" height="88" rx="16"/><rect x="910" y="424" width="242" height="103" rx="16"/><rect x="610" y="424" width="245" height="103" rx="16"/></g>
<g fill="none" stroke="#317761" stroke-width="3" marker-end="url(#arrow)"><path d="M266 243H315"/><path d="M568 243H595V184H624"/><path d="M595 243V314H624"/><path d="M855 314H904"/><path d="M1031 358V418"/><path d="M910 475H861"/></g>
<g text-anchor="middle"><text x="157" y="228" font-size="21" font-weight="700">Meeting / browser</text><text x="157" y="257" font-size="16">Speaker: system default</text><text x="157" y="280" font-size="16">or multi-output device</text><text x="444" y="231" font-size="21" font-weight="700">OfferMe + BlackHole</text><text x="444" y="263" font-size="16">Multi-Output Device</text><text x="742" y="176" font-size="21" font-weight="700">Headphones / speakers</text><text x="742" y="206" font-size="16">You hear the conversation</text><text x="742" y="306" font-size="21" font-weight="700">BlackHole 2ch</text><text x="742" y="336" font-size="16">Virtual audio input</text><text x="1031" y="306" font-size="21" font-weight="700">OfferMe capture</text><text x="1031" y="336" font-size="16">Other-party input: BlackHole</text><text x="1031" y="460" font-size="21" font-weight="700">Speech API</text><text x="1031" y="489" font-size="16">Audio → transcript</text><text x="1031" y="513" font-size="14">WebSocket inference endpoint</text><text x="732" y="460" font-size="21" font-weight="700">Answer API</text><text x="732" y="489" font-size="16">Question + enabled context</text><text x="732" y="513" font-size="14">Chat Completions endpoint</text></g>
<text x="48" y="412" font-size="18" font-weight="700">Keep the two microphone choices separate</text><text x="48" y="445" font-size="17">Meeting microphone → your physical mic</text><text x="48" y="477" font-size="17">OfferMe microphone → optional own-voice capture</text><text x="48" y="570" font-size="17" fill="#52695e">Headphones only: no BlackHole signal. BlackHole only: no audible playback. Use both outputs.</text>
</g></svg>
